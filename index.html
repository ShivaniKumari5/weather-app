<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Huninn&family=Jost:ital,wght@0,100..900;1,100..900&family=League+Spartan:wght@100..900&family=Matangi:wght@300..900&family=Merriweather+Sans:ital,wght@0,300..800;1,300..800&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Mulish:ital,wght@0,200..1000;1,200..1000&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="wrapper">
        <h1>Weather app</h1>
        <!-- tab container -->
         <div class="tab-container">
         <p class="tab" data-userWeather>Your Weather</p>
         <p class="tab" data-searchWeather>Search Weather</p>
        </div>

       
    <div class="weather-container">
        <!-- location-container -->
         <div class="grant-location-container sub-container">
            <img src="./assets/location.png" width="80" height="80" loading="lazy">
            <p>Grant Access Location</p>
            <p>Allow Access To Get Weather Information</p>
            <button class="btn" data-grantAccess>
                Grant Access
            </button>
         </div>

         <!-- search weather -->
          <form class="form-container" data-searchForm>
            <input placeholder="Enter Your City...." data-searchInput>
            <button class="btn" type="submit">
                <img src="./assets/search.png" width="20" height="20">
            </button>
          </form>

          <!-- loading screen -->
           <div class="loading-container sub-container">
            <img src="./assets/loading.gif" width="150" height="150">
            <p>Loading</p>
           </div>

           <!-- show weather info -->
            <div class="user-info-container sub-container">
                <div class="name">
                    <p data-cityName></p> 
                    <img data-countryIcon >             
                 </div>
                 <p data-weatherDesc></p>
                 <img data-weatherIcon>
                 <p data-temp></p>
                  <!-- 3 cards parameter -->
                   <div class="parameter-container">
                    <!-- card1 -->
                     <div class="parameter">
                        <img src="./assets/wind.png">
                        <p>Windspeed</p>
                        <p data-windSpeed></p>
                     </div>
                     <!-- card2 -->
                      <div class="parameter">
                        <img src="./assets/humidity.png">
                        <p>Humidity</p>
                        <p data-humidity></p>
                      </div>
                      <!-- card3 -->
                       <div class="parameter">
                        <img src="./assets/cloud.png">
                        <p>Cloudiness</p>
                        <p data-cloudiness></p>
                       </div>
                   </div>
            </div>
    </div>


     <!-- error-container -->
         <div class="error-container">
            <img src="./assets/not-found.png" error-img>
            <p>City not found</p>
         </div>

 </div>   






    <script src="./script.js"></script>
</body>
</html>
